<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Manipulation</title>
    <link rel="stylesheet" href="image_manipulation.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <div class="image-manipu">
        <h2 class="fs-5 mt-4">Image Manipulations with JavaScript</h2>
        <img id="sourceImage" src="img/what.jpg" alt="Original Image" crossOrigin="anonymous" width="400px"
            height="500px">
        <canvas id="canvas" class="rounded"></canvas>

        <div>
            <button class="btn btn-dark" onclick="toGrayscale()">Grayscale</button>
            <button class="btn btn-warning" onclick="increaseBrightness()">Brightness +</button>
            <button class="btn btn-primary" onclick="increaseContrast()">Contrast +</button>
            <button class="btn btn-danger" onclick="invertColors()">Invert</button>
            <button class="btn btn-success" onclick="vignette()">Vignette</button>
        </div>
    </div>

    <script src="image_manipu.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>
</html>
