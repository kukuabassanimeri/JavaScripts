<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Recorder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-light">

    <div class="container py-4">
        <h2 class="mb-4 text-primary text-center">🎥 Webcam & Microphone Recorder</h2>

        <!-- Device Selection -->
        <div class="row mb-3">
            <div class="col-md-6 mb-2">
                <label for="videoSource" class="form-label">Select Camera:</label>
                <select id="videoSource" class="form-select"></select>
            </div>
            <div class="col-md-6 mb-2">
                <label for="audioSource" class="form-label">Select Microphone:</label>
                <select id="audioSource" class="form-select"></select>
            </div>
            <div class="col-12 mt-2">
                <button id="start-stream" class="btn btn-success w-100">Start Stream</button>
            </div>
        </div>

        <!-- Live Preview -->
        <div class="video-container mb-3 text-center">
            <video id="preview" autoplay muted class="rounded"></video>
            <div id="timestamp">00:00</div>
        </div>

        <!-- Recording Buttons -->
        <div class="d-flex justify-content-center gap-2 mb-4">
            <button id="start-record" class="btn btn-primary">Start Recording</button>
            <button id="stop-record" class="btn btn-danger">Stop Recording</button>
            <button id="download" class="btn btn-secondary" disabled>Download Recording</button>
        </div>

        <hr>

        <!-- Playback Section -->
        <h3 class="text-center text-secondary">🎬 Playback</h3>
        <div class="text-center mb-3">
            <video class="rounded" id="recorded-video" controls></video>
        </div>

        <!-- Playback Controls -->
        <div class="d-flex justify-content-center gap-2">
            <button id="play" class="btn btn-outline-primary">Play</button>
            <button id="pause" class="btn btn-outline-secondary">Pause</button>
            <button id="forward" class="btn btn-outline-success">Forward 5s</button>
            <button id="rewind" class="btn btn-outline-warning">Rewind 5s</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>
</body>

</html>
