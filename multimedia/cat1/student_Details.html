<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compute Student Results</title>
  <link rel="stylesheet" href="student.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>

<body class="bg-light">
  <div class="container py-3">
    <h4 class="text-center mb-3">Enter Marks for Each Student</h4>
    <h6 id="status" class="text-center text-secondary mb-4">Student 1</h6>

    <div id="studentForm" class="card p-3 shadow-sm">
      <div class="mb-2">
        <label for="name" class="form-label">Student Name</label>
        <input type="text" id="name" class="form-control form-control-sm">
      </div>

      <div class="row">
        <div class="col-6 mb-2">
          <label for="a1" class="form-label">Assignment 1</label>
          <input type="number" id="a1" class="form-control form-control-sm" min="0" max="100">
        </div>
        <div class="col-6 mb-2">
          <label for="a2" class="form-label">Assignment 2</label>
          <input type="number" id="a2" class="form-control form-control-sm" min="0" max="100">
        </div>
        <div class="col-6 mb-2">
          <label for="a3" class="form-label">Assignment 3</label>
          <input type="number" id="a3" class="form-control form-control-sm" min="0" max="100">
        </div>
        <div class="col-6 mb-2">
          <label for="cat1" class="form-label">CAT 1</label>
          <input type="number" id="cat1" class="form-control form-control-sm" min="0" max="100">
        </div>
        <div class="col-6 mb-2">
          <label for="cat2" class="form-label">CAT 2</label>
          <input type="number" id="cat2" class="form-control form-control-sm" min="0" max="100">
        </div>
        <div class="col-6 mb-2">
          <label for="final" class="form-label">Final Exam</label>
          <input type="number" id="final" class="form-control form-control-sm" min="0" max="100">
        </div>
      </div>

      <div class="mt-3 d-grid gap-2">
        <button onclick="nextStudent()" id="nextBtn" class="btn btn-primary btn-sm" disabled>Next</button>
        <button id="computeBtn" onclick="computeGrades()" class="btn btn-success btn-sm">Compute Grades</button>
      </div>
    </div>
  </div>

  <script src="student_Details.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
